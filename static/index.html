<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Service Desk Copilot</title>
<style>
:root{--bg:#07111f;--panel:#0e1b2d;--panel2:#12243a;--line:#243b56;--text:#e8f0f8;--muted:#92a8bd;--blue:#5eb1ff;--green:#40d39c;--amber:#f6c85f;--red:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07111f,#0a1728 55%,#101f33);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;min-height:100vh}header{padding:24px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#081524e8;position:sticky;top:0;z-index:2}h1{font-size:21px;margin:0}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:800}.banner{padding:9px 14px;border:1px solid #725c23;background:#2d2614;color:#f7d982;border-radius:9px;font-size:12px}main{padding:22px 32px;max-width:1550px;margin:auto}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.metric,.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 30px #0003}.metric{padding:15px}.metric b{font-size:26px;display:block}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.layout{display:grid;grid-template-columns:.9fr 1.5fr;gap:16px}.panel{overflow:hidden}.panel-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-head h2{font-size:14px;margin:0}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:9px 12px;font-weight:750;cursor:pointer;background:var(--blue);color:#06111e}button.secondary{background:#1b324a;color:var(--text);border:1px solid var(--line)}button.green{background:var(--green)}button.danger{background:#3b1d29;color:#ff9ba7;border:1px solid #6b3042}.ticket{padding:14px 17px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:start}.ticket:hover,.ticket.active{background:#18304a}.id{color:var(--blue);font-size:12px;font-weight:800}.title{font-weight:750;font-size:13px}.meta{font-size:11px;color:var(--muted);margin-top:5px}.pill{border-radius:99px;padding:4px 8px;font-size:10px;font-weight:850;background:#21354b;color:#b9cce0}.p1{background:#4b1d2a;color:#ff9bab}.p2{background:#4a3517;color:#ffd37b}.detail{padding:20px;min-height:640px}.detail h3{margin:4px 0 6px;font-size:21px}.description{background:#091726;border:1px solid var(--line);padding:14px;border-radius:10px;line-height:1.5;color:#cbd8e5;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.fact{padding:10px;background:#0a1929;border-radius:8px;border:1px solid #1e354d}.fact label{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.fact b{font-size:12px}.analysis,.workspace{border-left:3px solid var(--blue);padding:15px;background:#0b192a;margin-top:15px}.workspace{border-color:var(--green)}.analysis h4,.workspace h4{margin:0 0 9px}.analysis ul{padding-left:18px;color:#cbd8e5;font-size:12px;line-height:1.55}.citation{border:1px solid #294766;background:#10243a;border-radius:8px;padding:10px;margin:8px 0;font-size:12px}.citation b{color:var(--blue)}.notice{font-size:11px;color:var(--muted);margin-top:12px}.warning{font-size:11px;color:var(--amber);margin:8px 0}.empty{padding:80px 20px;text-align:center;color:var(--muted)}.step{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:12px;background:#091827}.step.current{border-color:var(--blue);box-shadow:0 0 0 1px #5eb1ff22}.step.done{border-color:#235d4b;background:#0b241f}.step-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}.step p{font-size:12px;color:#cbd8e5;line-height:1.45;margin:5px 0}.step small{color:var(--muted)}textarea,select{width:100%;background:#071522;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;margin:7px 0;font:inherit}textarea{min-height:76px;resize:vertical}.progress{height:7px;background:#071522;border-radius:99px;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:var(--green)}.handoff{background:#221b0c;border:1px solid #685122;border-radius:9px;padding:12px;margin-top:12px}.handoff pre{white-space:pre-wrap;color:#e8d7a8;font-size:11px}@media(max-width:950px){.metrics{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}header{position:static;gap:12px;align-items:flex-start;flex-direction:column}main{padding:15px}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div><div class="eyebrow">Synthetic IT Operations Lab</div><h1>AI Service Desk Copilot</h1></div><div class="banner">DEMO ONLY · No real customer, employee, or credential data</div></header>
<main><section class="metrics" id="metrics"></section><section class="layout"><div class="panel"><div class="panel-head"><h2>Incident queue</h2><button class="secondary" onclick="resetDemo()">Reset demo</button></div><div id="tickets"></div></div><div class="panel"><div class="panel-head"><h2>Technician review workspace</h2><span class="pill">HUMAN CONTROLLED</span></div><div class="detail" id="detail"><div class="empty">Select a synthetic ticket to inspect evidence and begin guided troubleshooting.</div></div></div></section></main>
<script>
let tickets=[],selected=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error((await r.json()).detail||r.statusText);return r.json()}
async function load(){tickets=await api('/api/tickets');const m=await api('/api/metrics');metrics.innerHTML=[['Tickets',m.ticket_count],['Open',m.open_count],['P1 incidents',m.p1_count],['SLA at risk',m.sla_at_risk_count],['Analyzed',m.analyzed_count]].map(x=>`<div class="metric"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');renderTickets();if(selected&&tickets.some(x=>x.id===selected))await show(selected)}
function renderTickets(){ticketsEl=document.getElementById('tickets');ticketsEl.innerHTML=tickets.map(t=>`<div class="ticket ${selected===t.id?'active':''}" onclick="show(${t.id})"><div class="id">INC${String(t.id).padStart(4,'0')}</div><div><div class="title">${esc(t.title)}</div><div class="meta">${esc(t.assignment_group)} · ${esc(t.status.replaceAll('_',' '))}</div></div><span class="pill ${t.priority.toLowerCase()}">${esc(t.priority)}</span></div>`).join('')}
function renderAnalysis(id,a,w){if(!a)return `<div class="actions"><button onclick="analyze(${id})">Analyze with copilot</button></div><div class="notice">Analysis does not modify priority, category, assignment, or status.</div>`;return `<div class="analysis"><h4>Copilot recommendation</h4><div class="grid"><div class="fact"><label>Priority</label><b>${esc(a.priority)}</b></div><div class="fact"><label>Category</label><b>${esc(a.category)}</b></div><div class="fact"><label>Route to</label><b>${esc(a.assignment_group)}</b></div></div>${a.requires_escalation?'<div class="warning">⚠ Escalation required — routine remediation prohibited</div>':''}<ul>${a.rationale.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h4>Evidence-backed runbook</h4>${a.citations.map(c=>`<div class="citation"><b>${esc(c.id)} · ${esc(c.title)} · v${esc(c.version||1)}</b><br>${esc(c.summary)}</div>`).join('')}${(a.duplicate_candidates||[]).map(d=>`<div class="warning">Possible duplicate: INC${String(d.ticket_id).padStart(4,'0')} · ${(d.score*100).toFixed(0)}% overlap · ${esc(d.shared_terms.join(', '))}</div>`).join('')}<div class="actions"><button class="green" onclick="review(${id},'accept')">Accept routing</button><button class="danger" onclick="review(${id},'reject')">Reject</button>${w?'':`<button onclick="startTroubleshooting(${id})">Start guided troubleshooting</button>`}</div><div class="notice">Recommendations and diagnostic steps do not claim that any real action was executed.</div></div>`}
function renderWorkspace(w){if(!w)return '';const completed=w.steps.filter(s=>s.status==='completed').length,pct=Math.round(completed/Math.max(w.steps.length,1)*100);const steps=w.steps.map(s=>`<div class="step ${s.status==='completed'?'done':''} ${s.ordinal===w.current_step?'current':''}"><div class="step-head"><b>Step ${s.ordinal}</b><span class="pill">${esc(s.status)}</span></div><p>${esc(s.instruction)}</p><small>Purpose: ${esc(s.purpose)}<br>Expected evidence: ${esc(s.expected_evidence)}${s.citation_id?` · Source: ${esc(s.citation_id)}`:''}</small>${s.status==='completed'?`<p><b>${esc(s.outcome)}</b> — ${esc(s.observation)}</p>`:''}${s.ordinal===w.current_step&&w.status==='in_progress'?`<textarea id="observation" placeholder="Record the observed synthetic result. Never enter passwords, tokens, or real customer data."></textarea><select id="outcome"><option value="confirmed">Evidence confirmed</option><option value="not_found">Expected evidence not found</option><option value="inconclusive">Inconclusive</option></select><button onclick="submitEvidence(${w.id},${s.ordinal})">Save evidence & continue</button>`:''}</div>`).join('');let finish='';if(w.status==='awaiting_verification')finish=`<div class="step current"><b>Resolution verification</b><p>Record an observable test proving whether service was restored.</p><textarea id="verification" placeholder="Example: Hostname resolves and the synthetic application opens successfully."></textarea><div class="actions"><button class="green" onclick="verify(${w.id},true)">Verified restored</button><button class="danger" onclick="verify(${w.id},false)">Not restored — escalate</button></div></div>`;if(w.status==='escalation_ready')finish=`<div class="handoff"><b>Escalation package ready</b><pre>${esc(JSON.stringify(w.escalation_package,null,2))}</pre><div class="notice">This is a simulated handoff. No external team or system was contacted.</div></div>`;if(w.status==='verified')finish='<div class="step done"><b>✓ Service restoration verified by a human technician</b><p>The ticket is marked resolved; no autonomous action was claimed.</p></div>';return `<div class="workspace"><div class="eyebrow">Interactive troubleshooting · ${esc(w.mode.replaceAll('_',' '))}</div><h4>${esc(w.hypothesis)}</h4><div class="grid"><div class="fact"><label>Status</label><b>${esc(w.status.replaceAll('_',' '))}</b></div><div class="fact"><label>Confidence</label><b>${esc(w.confidence)}</b></div><div class="fact"><label>Progress</label><b>${esc(w.progress_label)}</b></div></div><div class="progress"><span style="width:${pct}%"></span></div><div class="warning">Stop condition: ${esc(w.stop_condition)}</div>${steps}${finish}</div>`}
async function show(id){selected=id;const [t,w]=await Promise.all([api('/api/tickets/'+id),api(`/api/tickets/${id}/troubleshooting`)]);renderTickets();detail.innerHTML=`<div class="eyebrow">INC${String(t.id).padStart(4,'0')} · ${esc(t.requester)}</div><h3>${esc(t.title)}</h3><div class="description">${esc(t.description)}</div><div class="grid"><div class="fact"><label>Status</label><b>${esc(t.status)}</b></div><div class="fact"><label>Priority</label><b>${esc(t.priority)}</b></div><div class="fact"><label>Group</label><b>${esc(t.assignment_group)}</b></div></div>${renderAnalysis(id,t.analysis,w)}${renderWorkspace(w)}`}
async function analyze(id){await api(`/api/tickets/${id}/analyze`,{method:'POST'});await load()}
async function review(id,decision){const note=decision==='reject'?(prompt('Optional rejection reason:')||''):'Technician reviewed cited evidence';await api(`/api/tickets/${id}/apply`,{method:'POST',body:JSON.stringify({decision,technician:'Demo Analyst',note})});await load()}
async function startTroubleshooting(id){await api(`/api/tickets/${id}/troubleshooting/start`,{method:'POST'});await show(id)}
async function submitEvidence(session,ordinal){const observation=document.getElementById('observation').value.trim();if(observation.length<3){alert('Record the observed result first.');return}const outcome=document.getElementById('outcome').value;await api(`/api/troubleshooting/${session}/steps/${ordinal}/result`,{method:'POST',body:JSON.stringify({outcome,observation,technician:'Demo Analyst'})});await show(selected)}
async function verify(session,restored){const evidence=document.getElementById('verification').value.trim();if(evidence.length<3){alert('Record verification evidence first.');return}await api(`/api/troubleshooting/${session}/verify`,{method:'POST',body:JSON.stringify({restored,evidence,technician:'Demo Analyst'})});await load()}
async function resetDemo(){await api('/api/demo/reset',{method:'POST'});selected=null;detail.innerHTML='<div class="empty">Demo reset. Select a synthetic ticket.</div>';await load()}
load().then(()=>{if(!tickets.length)resetDemo()}).catch(e=>detail.innerHTML=`<div class="empty">${esc(e.message)}</div>`)
</script>
</body></html>
