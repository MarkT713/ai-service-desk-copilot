[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service-desk-copilot"
version = "0.3.0"
description = "Synthetic, human-controlled, cost-aware AI service desk workflow demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn==0.52.1",
  "pydantic==2.13.4",
  "tiktoken==0.13.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.10.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.2",
]

[tool.setuptools]
packages = ["service_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E402"]
