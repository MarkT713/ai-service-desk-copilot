<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Service Desk Copilot</title>
<style>
:root{--bg:#07111f;--panel:#0e1b2d;--panel2:#12243a;--line:#243b56;--text:#e8f0f8;--muted:#92a8bd;--blue:#5eb1ff;--green:#40d39c;--amber:#f6c85f;--red:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07111f,#0a1728 55%,#101f33);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;min-height:100vh}header{padding:24px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#081524e8;position:sticky;top:0;z-index:2}h1{font-size:21px;margin:0}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:800}.banner{padding:9px 14px;border:1px solid #725c23;background:#2d2614;color:#f7d982;border-radius:9px;font-size:12px}main{padding:22px 32px;max-width:1500px;margin:auto}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.metric,.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 30px #0003}.metric{padding:15px}.metric b{font-size:26px;display:block}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.layout{display:grid;grid-template-columns:1.05fr 1.4fr;gap:16px}.panel{overflow:hidden}.panel-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-head h2{font-size:14px;margin:0}.toolbar{display:flex;gap:8px}button{border:0;border-radius:8px;padding:9px 12px;font-weight:750;cursor:pointer;background:var(--blue);color:#06111e}button.secondary{background:#1b324a;color:var(--text);border:1px solid var(--line)}button.green{background:var(--green)}button.danger{background:#3b1d29;color:#ff9ba7;border:1px solid #6b3042}.ticket{padding:14px 17px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:start}.ticket:hover,.ticket.active{background:#18304a}.id{color:var(--blue);font-size:12px;font-weight:800}.title{font-weight:750;font-size:13px}.meta{font-size:11px;color:var(--muted);margin-top:5px}.pill{border-radius:99px;padding:4px 8px;font-size:10px;font-weight:850;background:#21354b;color:#b9cce0}.p1{background:#4b1d2a;color:#ff9bab}.p2{background:#4a3517;color:#ffd37b}.detail{padding:20px;min-height:600px}.detail h3{margin:4px 0 6px;font-size:21px}.description{background:#091726;border:1px solid var(--line);padding:14px;border-radius:10px;line-height:1.5;color:#cbd8e5;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.fact{padding:10px;background:#0a1929;border-radius:8px;border:1px solid #1e354d}.fact label{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.fact b{font-size:12px}.analysis{border-left:3px solid var(--blue);padding:15px;background:#0b192a;margin-top:15px}.analysis h4{margin:0 0 9px}.analysis ul{padding-left:18px;color:#cbd8e5;font-size:12px;line-height:1.55}.citation{border:1px solid #294766;background:#10243a;border-radius:8px;padding:10px;margin:8px 0;font-size:12px}.citation b{color:var(--blue)}.actions{display:flex;gap:9px;margin:16px 0}.empty{padding:80px 20px;text-align:center;color:var(--muted)}.notice{font-size:11px;color:var(--muted);margin-top:12px}.duplicate{font-size:11px;color:var(--amber);margin:6px 0}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}header{position:static;gap:12px;align-items:flex-start;flex-direction:column}main{padding:15px}.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div><div class="eyebrow">Synthetic IT Operations Lab</div><h1>AI Service Desk Copilot</h1></div><div class="banner">DEMO ONLY · No real customer, employee, or credential data</div></header>
<main><section class="metrics" id="metrics"></section><section class="layout"><div class="panel"><div class="panel-head"><h2>Incident queue</h2><div class="toolbar"><button class="secondary" onclick="resetDemo()">Reset demo</button></div></div><div id="tickets"></div></div><div class="panel"><div class="panel-head"><h2>Technician review workspace</h2><span class="pill">HUMAN CONTROLLED</span></div><div class="detail" id="detail"><div class="empty">Select a synthetic ticket to inspect the evidence and request a copilot suggestion.</div></div></div></section></main>
<script>
let tickets=[],selected=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error((await r.json()).detail||r.statusText);return r.json()}
async function load(){tickets=await api('/api/tickets');const m=await api('/api/metrics');metrics.innerHTML=[['Tickets',m.ticket_count],['Open',m.open_count],['P1 incidents',m.p1_count],['SLA at risk',m.sla_at_risk_count],['Analyzed',m.analyzed_count]].map(x=>`<div class="metric"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');renderTickets();if(selected){const found=tickets.find(x=>x.id===selected);if(found)show(found.id)}}
function renderTickets(){document.getElementById('tickets').innerHTML=tickets.map(t=>`<div class="ticket ${selected===t.id?'active':''}" onclick="show(${t.id})"><div class="id">INC${String(t.id).padStart(4,'0')}</div><div><div class="title">${esc(t.title)}</div><div class="meta">${esc(t.assignment_group)} · ${esc(t.status.replaceAll('_',' '))}</div></div><span class="pill ${t.priority.toLowerCase()}">${esc(t.priority)}</span></div>`).join('')}
async function show(id){selected=id;const t=await api('/api/tickets/'+id);renderTickets();let a=t.analysis;let analysis=a?`<div class="analysis"><h4>Copilot recommendation</h4><div class="grid"><div class="fact"><label>Priority</label><b>${esc(a.priority)}</b></div><div class="fact"><label>Category</label><b>${esc(a.category)}</b></div><div class="fact"><label>Route to</label><b>${esc(a.assignment_group)}</b></div></div>${a.requires_escalation?'<div class="duplicate">⚠ Escalation required — automated action prohibited</div>':''}<ul>${a.rationale.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h4>Evidence-backed runbook</h4>${a.citations.map(c=>`<div class="citation"><b>${esc(c.id)} · ${esc(c.title)}</b><br>${esc(c.summary)}</div>`).join('')}<ol>${a.suggested_steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${(a.duplicate_candidates||[]).map(d=>`<div class="duplicate">Possible duplicate: INC${String(d.ticket_id).padStart(4,'0')} · ${(d.score*100).toFixed(0)}% lexical overlap · ${esc(d.shared_terms.join(', '))}</div>`).join('')}<div class="actions"><button class="green" onclick="review(${id},'accept')">Accept & apply</button><button class="danger" onclick="review(${id},'reject')">Reject suggestion</button></div><div class="notice">The copilot can suggest only. A named technician must apply routing or change ticket state.</div></div>`:`<div class="actions"><button onclick="analyze(${id})">Analyze with copilot</button></div><div class="notice">Analysis does not modify priority, category, assignment, or status.</div>`;document.getElementById('detail').innerHTML=`<div class="eyebrow">INC${String(t.id).padStart(4,'0')} · ${esc(t.requester)}</div><h3>${esc(t.title)}</h3><div class="description">${esc(t.description)}</div><div class="grid"><div class="fact"><label>Status</label><b>${esc(t.status)}</b></div><div class="fact"><label>Current priority</label><b>${esc(t.priority)}</b></div><div class="fact"><label>Current group</label><b>${esc(t.assignment_group)}</b></div></div>${analysis}`}
async function analyze(id){await api(`/api/tickets/${id}/analyze`,{method:'POST'});await load()}
async function review(id,decision){const note=decision==='reject'?(prompt('Optional rejection reason:')||''):'Technician reviewed cited evidence';await api(`/api/tickets/${id}/apply`,{method:'POST',body:JSON.stringify({decision,technician:'Demo Analyst',note})});await load()}
async function resetDemo(){await api('/api/demo/reset',{method:'POST'});selected=null;detail.innerHTML='<div class="empty">Demo reset. Select a synthetic ticket.</div>';await load()}
load().then(()=>{if(!tickets.length)resetDemo()}).catch(e=>detail.innerHTML=`<div class="empty">${esc(e.message)}</div>`)
</script></body></html>
