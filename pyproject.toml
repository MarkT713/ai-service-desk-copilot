[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service-desk-copilot"
version = "0.1.0"
description = "Synthetic, human-controlled AI service desk workflow demo"
requires-python = ">=3.11"
dependencies = ["fastapi==0.116.1", "uvicorn==0.35.0", "pydantic==2.11.7"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.1", "ruff==0.12.4"]

[tool.setuptools]
packages = ["service_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E402"]
